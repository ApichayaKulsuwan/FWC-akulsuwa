<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calc</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="calc-container">

        <input type="text" id="left-num" placeholder="Left Number">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right-num" placeholder="Right Number">

        <input type="submit" value="Try me!" id="calc-btn">

    </div>

    <script src="calc.js"></script>

</body>
</html>
